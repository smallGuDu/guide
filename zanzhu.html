<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赞赏支持</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft YaHei", Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa, #e4ecfb);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .card {
        background: #fff;
        width: 340px;
        padding: 35px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    h1 {
        color: #333;
        font-size: 28px;
        margin-bottom: 12px;
    }

    p {
        color: #666;
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .qrcode {
        width: 240px;
        max-width: 100%;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,.08);
        transition: transform .3s;
    }

    .qrcode:hover {
        transform: scale(1.03);
    }

    .tip {
        margin-top: 20px;
        font-size: 14px;
        color: #999;
    }
</style>
</head>
<body>

<div class="card">
    <h1>☕ 请作者喝杯咖啡</h1>
<img href="https://moe.8845.top/get/?name=%E8%B5%9E%E5%8A%A9soliar%E7%95%8C%E9%9D%A2&theme=asoul">
    <p>如果这个项目对您有所帮助，欢迎扫码赞赏支持，感谢您的鼓励！❤️</p>

    <img
        src="./mm_reward_qrcode_1782704598397.png"
        alt="赞赏码"
        class="qrcode"
    >

    <div class="tip">
        微信扫码即可赞赏
    </div>
</div>

</body>
</html>
